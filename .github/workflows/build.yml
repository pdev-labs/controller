name: Build Multi-OS Controller

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            target: linux
            builder-args: "--linux AppImage deb --x64"
          - os: ubuntu-latest
            arch: arm64
            target: linux
            builder-args: "--linux AppImage deb --arm64"
          - os: windows-latest
            arch: x64
            target: win
            builder-args: "--win nsis --x64"
          - os: macos-latest
            arch: universal
            target: mac
            builder-args: "--mac dmg --universal"
          - os: macos-latest
            arch: arm64
            target: mac
            builder-args: "--mac dmg --arm64"

    steps:
    - uses: actions/checkout@v4

    # Setup QEMU for ARM64 Linux builds
    - name: Set up QEMU
      if: matrix.os == 'ubuntu-latest' && matrix.arch == 'arm64'
      uses: docker/setup-qemu-action@v2
      with:
        platforms: arm64

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PyInstaller and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --progress-bar off pyinstaller pynput

    - name: Install Linux-specific dependencies
      if: runner.os == 'Linux'
      run: pip install --progress-bar off evdev

    - name: Install Windows-specific dependencies
      if: runner.os == 'Windows'
      env:
        VGAMEPAD_SKIP_VIGEMBUS_INSTALL: 'true'
      run: |
        python -m pip install --upgrade setuptools wheel
        pip install --progress-bar off git+https://github.com/yannbouteiller/vgamepad.git

    - name: Build Python Joystick Engine
      run: pyinstaller --onefile virtual_joystick.py

    - name: Install NPM dependencies
      run: npm install

    - name: Build Electron App
      run: npx electron-builder ${{ matrix.builder-args }} --publish never

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PSP-Controller-${{ matrix.os }}-${{ matrix.arch }}
        path: |
          dist/*.AppImage
          dist/*.AppImage.zsync
          dist/*.deb
          dist/*.exe
          dist/*.dmg

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/*.AppImage
          dist/*.AppImage.zsync
          dist/*.deb
          dist/*.exe
          dist/*.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
