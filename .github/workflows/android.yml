name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    - name: Install Dependencies
      run: npm install

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Decode Keystore
      working-directory: ./android/app
      run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > release.keystore

    - name: Build APK
      working-directory: ./android
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Rename APK
      run: mv android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/psp-controller-android.apk || mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/psp-controller-android.apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PSP-Controller-Android-APK
        path: android/app/build/outputs/apk/release/psp-controller-android.apk

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: android/app/build/outputs/apk/release/psp-controller-android.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
