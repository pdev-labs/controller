<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Universal PC Controller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <div class="controller-container">
        <div id="gamepad-mode" class="mode-container active">
            <!-- Top Triggers -->
        <div class="triggers">
            <div class="draggable-group" id="group-l">
                <button id="btn-l" class="trigger-btn l-btn md-btn" data-btn="btn-l">
                    L
                    <span class="md-ripple"></span>
                </button>
            </div>
            <div class="status-indicator">
                <div id="connection-status" class="status-dot disconnected"></div>
                <span>Universal PC Controller</span>
                <button id="gyro-btn" class="sys-btn md-btn" style="margin-left: 10px; padding: 4px 10px; font-size: 10px;">GYRO OFF<span class="md-ripple"></span></button>
                <select id="vibration-toggle" class="md-btn" style="background: var(--md-surface-container); border: none; color: var(--md-on-surface); font-size: 10px; margin-left: 5px; padding: 4px; outline: none; border-radius: 4px;">
                    <option value="on">Haptics ON</option>
                    <option value="off">Haptics OFF</option>
                </select>
                <select id="gyro-sensitivity" class="md-btn" style="background: var(--md-surface-container); border: none; color: var(--md-on-surface); font-size: 10px; margin-left: 5px; padding: 4px; outline: none; border-radius: 4px;">
                    <option value="60">Low Sens</option>
                    <option value="30" selected>Med Sens</option>
                    <option value="15">High Sens</option>
                </select>
                <select id="theme-selector" class="md-btn" style="background: var(--md-surface-container); border: none; color: var(--md-on-surface); font-size: 10px; margin-left: 10px; padding: 4px; outline: none; border-radius: 4px;">
                    <option value="ps">PlayStation</option>
                    <option value="xbox">Xbox</option>
                    <option value="xbox-premium">Xbox Series Dark</option>
                    <option value="snes">SNES</option>
                </select>
                <button id="fullscreen-btn" class="sys-btn md-btn" style="margin-left: 10px; padding: 4px 10px; font-size: 14px;" title="Toggle Fullscreen">⛶<span class="md-ripple"></span></button>
            </div>
            <div class="draggable-group" id="group-r">
                <button id="btn-r" class="trigger-btn r-btn md-btn" data-btn="btn-r">
                    R
                    <span class="md-ripple"></span>
                </button>
            </div>
        </div>

        <!-- Middle Section (D-Pad and Action Buttons) -->
        <div class="middle-section">
            <!-- Left Side: D-Pad and Analog -->
            <div class="left-controls">
                <div class="draggable-group" id="group-dpad">
                    <div class="dpad">
                        <button class="dpad-btn up md-btn" data-btn="dpad-up"><span class="md-ripple"></span></button>
                        <button class="dpad-btn right md-btn" data-btn="dpad-right"><span class="md-ripple"></span></button>
                        <button class="dpad-btn down md-btn" data-btn="dpad-down"><span class="md-ripple"></span></button>
                        <button class="dpad-btn left md-btn" data-btn="dpad-left"><span class="md-ripple"></span></button>
                        <div class="dpad-center"></div>
                    </div>
                </div>
                
                <div class="draggable-group" id="group-analog">
                    <div class="analog-stick-container" id="analog-container">
                        <div class="analog-stick" id="analog-stick"></div>
                    </div>
                </div>
            </div>

            <!-- Right Side: Action Buttons -->
            <div class="right-controls">
                <div class="draggable-group" id="group-actions">
                    <div class="action-buttons">
                        <button class="action-btn triangle md-btn md-fab" data-btn="btn-triangle">
                            <span class="md-ripple"></span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3L22 21H2L12 3Z"/></svg>
                        </button>
                        <button class="action-btn circle md-btn md-fab" data-btn="btn-circle">
                            <span class="md-ripple"></span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
                        </button>
                        <button class="action-btn cross md-btn md-fab" data-btn="btn-cross">
                            <span class="md-ripple"></span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6L18 18"/></svg>
                        </button>
                        <button class="action-btn square md-btn md-fab" data-btn="btn-square">
                            <span class="md-ripple"></span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Section: Start / Select -->
        <div class="bottom-section">
            <div class="draggable-group" id="group-sys">
                <div class="sys-buttons">
                    <button class="sys-btn md-btn" data-btn="btn-select">SELECT<span class="md-ripple"></span></button>
                    <button class="sys-btn md-btn" data-btn="btn-start">START<span class="md-ripple"></span></button>
                    <button id="btn-2x" class="sys-btn md-btn" style="margin-left: 10px; font-weight: bold; background: #FF9800; color: #000;">&gt;&gt;<span class="md-ripple"></span></button>
                </div>
            </div>
            </div>
        </div>

        <div id="trackpad-mode" class="mode-container hidden">
            <div class="trackpad-header">
                <h3>Trackpad</h3>
                <button id="keyboard-btn" class="sys-btn md-btn md-filled">KEYBOARD<span class="md-ripple"></span></button>
            </div>
            <div id="trackpad-surface" class="trackpad-surface">
                <!-- Hidden input for mobile keyboard -->
                <input type="text" id="hidden-keyboard-input" class="hidden-input">
                <div class="trackpad-hint">1-Finger: Move & Tap to Click<br>2-Finger: Scroll & Tap for Right Click</div>
            </div>
        </div>

        <div id="keyboard-mode" class="mode-container hidden">
            <div class="trackpad-header">
                <h3>PC Keyboard</h3>
                <button id="close-keyboard-btn" class="sys-btn md-btn md-filled">CLOSE<span class="md-ripple"></span></button>
            </div>
            <div id="vk-container" class="vk-container"></div>
        </div>
        
        <!-- Fullscreen overlay for connecting -->
        <div id="overlay" class="overlay">
            <div class="overlay-content md-sheet">
                <h1 style="color: var(--md-primary); margin-bottom: 5px; font-weight: 500;">Universal Controller</h1>
                <p style="color: var(--md-secondary); font-size: 14px; margin-bottom: 15px;">Select Mode:</p>
                <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                    <button id="sel-gamepad" class="sys-btn md-btn active" style="padding: 10px 20px;">🎮 Gamepad<span class="md-ripple"></span></button>
                    <button id="sel-trackpad" class="sys-btn md-btn" style="padding: 10px 20px;">🖱️ Trackpad<span class="md-ripple"></span></button>
                </div>
                <div id="apk-ip-container" style="display: none; flex-direction: column; align-items: center; margin-bottom: 20px;">
                    <p style="color: var(--md-secondary); font-size: 12px; margin-bottom: 8px;">Enter PC IP Address:</p>
                    <input type="text" id="apk-ip-input" placeholder="e.g. 192.168.1.5" style="padding: 10px; border-radius: 8px; border: 1px solid var(--md-outline); background: var(--md-surface); color: var(--md-on-surface); text-align: center; font-size: 16px; width: 200px;">
                </div>
                <button id="connect-btn" class="connect-btn md-btn md-filled">Connect & Fullscreen<span class="md-ripple"></span></button>
                <button id="edit-layout-btn" class="edit-layout-btn md-btn md-outlined">Customize Layout<span class="md-ripple"></span></button>
            </div>
        </div>
        
        <!-- Edit Mode UI Overlay (hidden by default) -->
        <div id="edit-ui" class="edit-ui hidden">
            <div class="edit-header md-sheet">
                <h3>Edit Layout</h3>
                <p>Drag elements to move them. Use the slider below to resize.</p>
                <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
                    <button id="export-layout-btn" class="sys-btn md-btn md-outlined">Export<span class="md-ripple"></span></button>
                    <button id="import-layout-btn" class="sys-btn md-btn md-outlined">Import<span class="md-ripple"></span></button>
                    <input type="file" id="import-input" accept=".json" style="display: none;">
                </div>
            </div>
            <div class="edit-footer md-sheet">
                <input type="range" id="scale-slider" min="0.5" max="2" step="0.05" value="1" class="md-slider">
                <div class="edit-actions">
                    <button id="reset-layout-btn" class="danger-btn md-btn md-filled-error">Reset<span class="md-ripple"></span></button>
                    <button id="save-layout-btn" class="success-btn md-btn md-filled">Save Layout<span class="md-ripple"></span></button>
                </div>
            </div>
        </div>
    </div>

    <script src="controller.js?v=3"></script>
</body>
</html>
